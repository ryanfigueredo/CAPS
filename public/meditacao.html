<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditação Guiada - CAPS Digital</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; min-height: calc(100vh - 20px);">
        <div class="content-page" style="flex: 1;">
            <a href="index.html" class="back-button">
                <i class="ph ph-arrow-left ph-bold" style="font-size: 1.2rem; vertical-align: middle;"></i> Voltar
            </a>
            <h1 class="page-title">
                <i class="ph ph-lotus ph-duotone" style="font-size: 1.8rem; vertical-align: middle; margin-right: 8px;"></i>
                Meditação Guiada
            </h1>
            
            <div id="meditacoes-container" class="content-grid">
                <div class="empty-state">
                    <div class="icon">
                        <i class="ph ph-spinner ph-duotone ph-spin" style="font-size: 4rem;"></i>
                    </div>
                    <p>Carregando meditações...</p>
                </div>
            </div>
        </div>
        <footer style="text-align: center; color: white; padding: 15px 0; opacity: 0.8; font-size: 0.85rem; margin-top: 20px;">
            <p>CAPS - Centro de Atenção Psicossocial</p>
            <div class="footer-credits">
                <p>Desenvolvido por <a href="https://dmtn.com.br" target="_blank" rel="noopener">DMTN</a></p>
            </div>
        </footer>
    </div>

    <script>
        async function carregarMeditacoes() {
            try {
                const response = await fetch('/api/meditacoes');
                const meditacoes = await response.json();
                
                const container = document.getElementById('meditacoes-container');
                
                if (meditacoes.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">
                                <i class="ph ph-cloud-slash ph-duotone" style="font-size: 4rem;"></i>
                            </div>
                            <p>Nenhuma meditação disponível no momento.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = meditacoes.map(med => {
                    // Função para extrair ID do YouTube
                    function getYouTubeId(url) {
                        if (!url) return null;
                        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                        const match = url.match(regExp);
                        return (match && match[2].length === 11) ? match[2] : null;
                    }

                    let mediaContent = '';
                    if (med.url_youtube) {
                        const videoId = getYouTubeId(med.url_youtube);
                        if (videoId) {
                            mediaContent = `
                                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin-top: 15px; border-radius: 10px;">
                                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                                            src="https://www.youtube.com/embed/${videoId}" 
                                            frameborder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowfullscreen>
                                    </iframe>
                                </div>
                            `;
                        } else {
                            mediaContent = `<p style="margin-top: 15px;"><a href="${med.url_youtube}" target="_blank" class="btn btn-primary" style="text-decoration: none; display: inline-block;">Assistir no YouTube</a></p>`;
                        }
                    } else if (med.arquivo_audio) {
                        mediaContent = `
                            <audio controls class="audio-player">
                                <source src="/uploads/${med.arquivo_audio}" type="audio/mpeg">
                                Seu navegador não suporta áudio.
                            </audio>
                        `;
                    }

                    const mediaIcon = med.url_youtube 
                        ? '<i class="ph ph-play-circle ph-duotone" style="font-size: 1.2rem; vertical-align: middle; margin-right: 5px; color: var(--accent-color);"></i>'
                        : '<i class="ph ph-speaker-high ph-duotone" style="font-size: 1.2rem; vertical-align: middle; margin-right: 5px; color: var(--primary-color);"></i>';
                    
                    return `
                        <div class="content-item">
                            <h3>
                                <i class="ph ph-lotus ph-duotone" style="font-size: 1.5rem; vertical-align: middle; margin-right: 8px; color: var(--primary-color);"></i>
                                ${med.titulo}
                            </h3>
                            ${med.descricao ? `<p>${med.descricao}</p>` : ''}
                            ${med.duracao ? `<p class="meta"><i class="ph ph-clock ph-duotone" style="font-size: 0.9rem; vertical-align: middle; margin-right: 5px;"></i>Duração: ${med.duracao} minutos</p>` : ''}
                            ${mediaContent}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Erro ao carregar meditações:', error);
                document.getElementById('meditacoes-container').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <i class="ph ph-warning ph-duotone" style="font-size: 4rem;"></i>
                        </div>
                        <p>Erro ao carregar meditações. Tente novamente mais tarde.</p>
                    </div>
                `;
            }
        }
        
        carregarMeditacoes();
    </script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ph-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body>
</html>
