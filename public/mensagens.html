<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens Motivacionais - CAPS Digital</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; min-height: calc(100vh - 20px);">
        <div class="content-page" style="flex: 1;">
            <a href="index.html" class="back-button">
                <i class="ph ph-arrow-left ph-bold" style="font-size: 1.2rem; vertical-align: middle;"></i> Voltar
            </a>
            <h1 class="page-title">
                <i class="ph ph-chat-circle-dots ph-duotone" style="font-size: 1.8rem; vertical-align: middle; margin-right: 8px;"></i>
                Mensagens Motivacionais
            </h1>
            
            <div id="mensagens-container" class="content-grid">
                <div class="empty-state">
                    <div class="icon">
                        <i class="ph ph-spinner ph-duotone ph-spin" style="font-size: 4rem;"></i>
                    </div>
                    <p>Carregando mensagens...</p>
                </div>
            </div>
        </div>
        <footer style="text-align: center; color: white; padding: 15px 0; opacity: 0.8; font-size: 0.85rem; margin-top: 20px;">
            <p>CAPS - Centro de Atenção Psicossocial</p>
            <div class="footer-credits">
                <p>Desenvolvido por <a href="https://dmtn.com.br" target="_blank" rel="noopener">DMTN</a></p>
            </div>
        </footer>
    </div>

    <script>
        async function carregarMensagens() {
            try {
                const response = await fetch('/api/mensagens');
                const mensagens = await response.json();
                
                const container = document.getElementById('mensagens-container');
                
                if (mensagens.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">
                                <i class="ph ph-cloud-slash ph-duotone" style="font-size: 4rem;"></i>
                            </div>
                            <p>Nenhuma mensagem disponível no momento.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = mensagens.map(msg => `
                    <div class="content-item">
                        <h3>
                            <i class="ph ph-quote ph-duotone" style="font-size: 1.5rem; vertical-align: middle; margin-right: 8px; color: var(--primary-color);"></i>
                            ${msg.titulo}
                        </h3>
                        <p>${msg.conteudo}</p>
                        ${msg.autor ? `<p class="meta">— ${msg.autor}</p>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar mensagens:', error);
                document.getElementById('mensagens-container').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <i class="ph ph-warning ph-duotone" style="font-size: 4rem;"></i>
                        </div>
                        <p>Erro ao carregar mensagens. Tente novamente mais tarde.</p>
                    </div>
                `;
            }
        }
        
        carregarMensagens();
    </script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ph-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body>
</html>
